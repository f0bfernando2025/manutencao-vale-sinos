name: Deploy para HostGator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Diagnostico dos segredos
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "FTP_SERVER   -> ${#S} caracteres | comeca com: '${S:0:4}'"
          echo "FTP_USERNAME -> ${#U} caracteres | comeca com: '${U:0:2}'"
          echo "FTP_PASSWORD -> ${#P} caracteres (valor oculto)"

      - name: Testar login FTP (mostra so respostas do servidor)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -sS -v --ftp-pasv --connect-timeout 20 --max-time 30 \
            --user "$U:$P" "ftp://$S/" -o /dev/null 2>curl.log || true
          echo "--- Respostas do servidor FTP ---"
          grep -E '^< ' curl.log | sed -E 's/^< //' || echo "(sem respostas capturadas)"

      - name: Enviar via FTP para o HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.zip
            **/*.md
            **/memory/**
            **/README*
